services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: bodhi_vcs5_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bodhi_vcs5}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bodhi_vcs5}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
